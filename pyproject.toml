[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marvelverse-tracker"
version = "1.0.0"
description = "A professional desktop application for tracking Marvel movies and television projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "SQLAlchemy>=2.0",
    "alembic>=1.14",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "Pillow>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
