[alembic]
# script_location and sqlalchemy.url are set programmatically by
# database/__init__.py at runtime, based on the user's configured data
# directory. The values below are placeholders used only if this file is
# ever invoked directly from the command line for development purposes.
script_location = database/migrations
sqlalchemy.url = sqlite:///data/marvelverse.db

prepend_sys_path = .
path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
